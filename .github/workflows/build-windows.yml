name: Build JARVIS Windows
# Repository renamed to jarvis-ai to avoid invalid Windows checkout paths.

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

concurrency:
  group: jarvis-windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source/desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Verify checkout
        run: |
          Write-Host 'Repository downloaded successfully'
          Get-ChildItem -Name
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Verify JavaScript syntax
        run: |
          node --check main.cjs
          node --check preload.cjs
          node --check desktop-ui.js
      - name: Build Windows executable and installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-exe
          path: source/desktop/dist/*.exe
          retention-days: 30
          if-no-files-found: error
      - name: Publish desktop update to GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "desktop-v$version"
          $files = @(Get-ChildItem -Path dist -Filter '*.exe' | ForEach-Object { $_.FullName })
          $files += @(Get-ChildItem -Path dist -Filter 'latest*.yml' | ForEach-Object { $_.FullName })
          $files += @(Get-ChildItem -Path dist -Filter '*.blockmap' | ForEach-Object { $_.FullName })
          if (-not ($files | Where-Object { $_ -like '*latest*yml' })) { throw "Missing update metadata latest.yml" }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --target main --title "J.A.R.V.I.S. Desktop $version" --notes "Windows installer and application auto-update files. Install JARVIS-Setup once; future versions download inside the app."
          }
