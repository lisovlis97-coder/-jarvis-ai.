name: Build JARVIS Windows
# Repository renamed to jarvis-ai to avoid invalid Windows checkout paths.

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source/desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - name: Verify checkout
        run: |
          Write-Host 'Repository downloaded successfully'
          Get-ChildItem -Name
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Verify JavaScript syntax
        run: |
          node --check main.cjs
          node --check preload.cjs
      - name: Build Windows executable and installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-windows-exe
          path: source/desktop/dist/*.exe
          retention-days: 30
          if-no-files-found: error
