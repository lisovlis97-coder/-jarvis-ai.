<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020c16"><title>J.A.R.V.I.S. 4.0</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 25%,#0b304a 0%,#031321 37%,#010711 83%);font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#ccecff;min-height:100dvh}main{max-width:650px;margin:auto;padding:26px 18px 44px}.top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:2px;color:#5fcdf6}.chip{border:1px solid #1c6b8e;padding:8px;border-radius:8px}.brand{text-align:center;letter-spacing:7px;font-size:27px;font-weight:300;margin:32px 0 4px;text-shadow:0 0 16px #1a9ce2}.subtitle{text-align:center;color:#6da9c8;font-size:10px;letter-spacing:3px}.corewrap{height:270px;display:grid;place-items:center;position:relative;margin:8px auto}.core{border:2px solid #43d3ff;width:196px;height:196px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 26px #00b8ff50,inset 0 0 35px #009fe655;animation:spin 13s linear infinite;background:repeating-conic-gradient(from 10deg,#04b9f81c 0deg 5deg,transparent 5deg 16deg)}.core:before{content:'';position:absolute;width:157px;height:157px;border:3px dashed #47cfff99;border-radius:50%;animation:spin 7s linear infinite reverse}.core:after{content:'';position:absolute;width:100px;height:100px;border:2px solid #86ebff;border-radius:50%;box-shadow:0 0 25px #15c9fc, inset 0 0 30px #17c7e9}.center{font-size:13px;letter-spacing:3px;font-weight:bold;z-index:1;animation:spin 13s linear infinite reverse}.listening .core{box-shadow:0 0 65px #00dbff99;animation-duration:3s}.thinking .core{border-color:#deb3ff;box-shadow:0 0 45px #a84fff}.speaking .core{box-shadow:0 0 80px #3bdeff;animation-duration:2s}@keyframes spin{to{transform:rotate(360deg)}}.status{text-align:center;letter-spacing:2px;color:#5dd9ff;font-size:12px;margin-bottom:14px}.answer{border:1px solid #174560;background:#0620399c;padding:16px;border-radius:14px;min-height:85px;line-height:1.6;text-align:center}.controls{display:flex;gap:9px;justify-content:center;margin:16px 0}.btn{background:#062d46;border:1px solid #318fb6;color:#d2f4ff;border-radius:12px;padding:15px 17px;font:inherit;cursor:pointer}.btn:disabled{opacity:.45}.primary{background:#0b5c81;flex:1}.sendline{display:flex;gap:8px;margin:12px 0}input{width:100%;min-width:0;background:#061b2d;color:white;border:1px solid #246b8c;padding:14px;border-radius:12px;font-size:16px}.log{max-height:245px;overflow:auto;border:1px solid #103c55;border-radius:12px;padding:10px;background:#020e1bc0;margin-top:15px;font-size:13px}.msg{margin-bottom:12px;line-height:1.45;white-space:pre-wrap}.msg b{display:block;color:#61d4ff;font-size:10px;letter-spacing:1.5px;margin-bottom:3px}.settings{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:12px;color:#99cce0;margin-top:18px}select{background:#092136;color:#cdefff;border:1px solid #28617c;border-radius:7px;padding:7px;max-width:100%}footer{font-size:11px;color:#598ca5;text-align:center;margin-top:24px;line-height:1.5}</style></head><body><main>
<div class="top"><span>STARK INSPIRED INTERFACE</span><span id="online" class="chip">● CONNECTING</span></div><h1 class="brand">J.A.R.V.I.S.</h1><div class="subtitle">PERSONAL INTELLIGENCE SYSTEM • V4</div>
<div id="stage" class="corewrap"><div class="core"><div class="center">ONLINE</div></div></div><div id="status" class="status">ЗАПУСК СИСТЕМЫ</div><div id="answer" class="answer" aria-live="polite">Добро пожаловать, сэр. Нажмите «Говорить» или напишите команду.</div>
<div class="controls"><button class="btn primary" id="mic">🎙 ГОВОРИТЬ</button><button class="btn" id="hello">🔊 ТЕСТ ГОЛОСА</button><button class="btn" id="stop">■</button></div>
<div class="sendline"><input id="input" type="text" placeholder="Напиши команду Джарвису…" autocomplete="off"><button class="btn" id="send">➤</button></div>
<div class="settings"><label><input id="continuous" type="checkbox"> Продолжать слушать*</label><label>Голос <select id="voices"><option value="">Системный</option></select></label><label>Скорость <select id="speed"><option value="0.85">0.85</option><option selected value="1">1.0</option><option value="1.1">1.1</option></select></label><button class="btn" id="clear">Очистить память</button></div><div id="mode" class="settings">Проверка сервера...</div><div id="log" class="log"></div><footer id="diagnostics">* Safari может остановить микрофон при блокировке экрана и между репликами.</footer></main>
<script>
'use strict';const $=id=>document.getElementById(id),SR=window.SpeechRecognition||window.webkitSpeechRecognition,synth=window.speechSynthesis;let voices=[],history=[],ai=false,busy=false,rec=null,keep=false;
try{const a=JSON.parse(localStorage.getItem('jarvis-render-history')||'[]');if(Array.isArray(a))history=a.filter(x=>x&&['user','model'].includes(x.role)&&typeof x.text==='string').slice(-24)}catch{}
function state(t,cls=''){$('status').textContent=t;$('stage').className='corewrap '+cls}
function paint(){$('log').replaceChildren();if(!history.length){$('log').textContent='История пока пуста.';return}for(const v of history.slice(-20)){const div=document.createElement('div'),b=document.createElement('b');div.className='msg';b.textContent=v.role==='user'?'ВЫ':'ДЖАРВИС';div.append(b,document.createTextNode(v.text));$('log').append(div)}$('log').scrollTop=$('log').scrollHeight}
function add(role,text){history.push({role,text});history=history.slice(-24);try{localStorage.setItem('jarvis-render-history',JSON.stringify(history))}catch{}paint()}
function refresh(){if(!synth)return;voices=synth.getVoices();let old=$('voices').value;$('voices').replaceChildren();$('voices').add(new Option('Системный',''));voices.forEach((v,i)=>{if(/^ru/i.test(v.lang))$('voices').add(new Option(v.name+(v.localService?' · локальный':''),String(i)))});if([...$('voices').options].some(x=>x.value===old))$('voices').value=old;else{const fav=[...$('voices').options].find(o=>/Yuri|Юрий|Pavel|Павел/i.test(o.textContent));if(fav)$('voices').value=fav.value} $('diagnostics').textContent='Русских голосов: '+($('voices').options.length-1)+' · Микрофон: '+(SR?'доступен':'не поддерживается')+' · HTTPS: '+(isSecureContext?'да':'нет')+'. * Safari может остановить автоматическое прослушивание.'}
function say(t,restart=false){$('answer').textContent=t;if(!synth){state('ОЗВУЧКА НЕДОСТУПНА');return}try{synth.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[\*#`]/g,''));u.lang='ru-RU';u.rate=Number($('speed').value);u.pitch=.93;const i=$('voices').value;if(i!==''&&voices[Number(i)])u.voice=voices[Number(i)];u.onstart=()=>state('ДЖАРВИС ГОВОРИТ','speaking');u.onend=()=>{state('ГОТОВ К РАБОТЕ');if(restart&&keep&&$('continuous').checked)setTimeout(()=>listen(true),550)};u.onerror=()=>state('ОШИБКА ОЗВУЧКИ');synth.speak(u)}catch{state('ГОЛОС НЕ ЗАПУСТИЛСЯ')}}
function demo(t){const s=t.toLowerCase();if(/привет|здравствуй|добрый/.test(s))return 'Рад вас слышать, сэр. Все основные системы работают. ИИ-модуль пока ожидает подключения.';if(/время|число|дат/.test(s))return 'Сейчас '+new Date().toLocaleString('ru-RU',{dateStyle:'long',timeStyle:'short'})+'.';if(/что умеешь|статус/.test(s))return 'Я слышу ваш голос, отвечаю вслух и запоминаю сообщения на этом устройстве. Свободный диалог заработает после подключения Gemini API.';return 'Принято, сэр. Сейчас доступен демонстрационный режим. Для свободного диалога нужно подключить ИИ на сервере.'}
async function send(t){t=(t||'').trim();if(!t||busy)return;keep=$('continuous').checked;busy=true;$('mic').disabled=true;$('send').disabled=true;add('user',t);$('input').value='';state('АНАЛИЗИРУЮ ЗАПРОС','thinking');$('answer').textContent='Обрабатываю запрос…';let ans;if(ai){try{const res=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({history:history.slice(-16)})}),data=await res.json();if(!res.ok)throw Error(data.error||'Ошибка подключения');ans=data.answer||'Я не смог сформировать ответ.'}catch(e){ans='Не удалось связаться с ИИ: '+String(e.message||e)}}else ans=demo(t);add('model',ans);busy=false;$('mic').disabled=false;$('send').disabled=false;say(ans,true)}
function listen(restart=false){if(!SR){say('К сожалению, распознавание речи недоступно в этом браузере. Напишите запрос текстом.');return}if(busy||rec)return;if(!restart)keep=$('continuous').checked;try{synth?.cancel();const r=new SR();rec=r;r.lang='ru-RU';r.interimResults=false;r.maxAlternatives=1;let heard=false;r.onstart=()=>state('СЛУШАЮ ВАС','listening');r.onresult=e=>{heard=true;const t=e.results?.[0]?.[0]?.transcript||'';rec=null;if(t)send(t)};r.onerror=e=>{rec=null;state('МИКРОФОН: '+e.error)};r.onend=()=>{if(rec===r)rec=null;if(!heard&&!busy)state('ГОТОВ К РАБОТЕ')};r.start()}catch{rec=null;state('МИКРОФОН НЕ ЗАПУСТИЛСЯ')}}
$('send').onclick=()=>send($('input').value);$('input').onkeydown=e=>{if(e.key==='Enter')send($('input').value)};$('mic').onclick=()=>listen();$('hello').onclick=()=>say('Добрый вечер, сэр. Джарвис на связи. Все системы готовы к работе.');$('stop').onclick=()=>{keep=false;if(rec){try{rec.abort()}catch{}rec=null}synth?.cancel();state('ОСТАНОВЛЕНО')};$('clear').onclick=()=>{history=[];try{localStorage.removeItem('jarvis-render-history')}catch{}paint();say('Память текущего устройства очищена, сэр.')};
if(synth){refresh();synth.onvoiceschanged=refresh}paint();state('ГОТОВ К РАБОТЕ');
(async()=>{try{const res=await fetch('/api/chat'),d=await res.json();ai=!!d.ready;$('online').textContent=ai?'● AI ONLINE':'● DEMO';$('mode').textContent=ai?'Нейросеть подключена. Спросите меня о чём угодно.':'Демо работает. Чтобы отвечать на любые вопросы, нужно добавить GEMINI_API_KEY в Render.'}catch{$('online').textContent='● OFFLINE';$('mode').textContent='Сервер ИИ не отвечает. Демо-команды доступны.'}})();
</script></body></html>
